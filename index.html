<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Acompanhamento Acadêmico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Acompanhamento Acadêmico</h1>

        <form id="form-aluno">
            <label for="nome">Nome do aluno:</label>
            <input type="text" id="nome" placeholder="Digite o nome">

            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" placeholder="0 a 10">

            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" placeholder="0 a 10">

            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" placeholder="0 a 10">

            <button type="button" id="btn-calcular">Calcular Média</button>
        </form>
    
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
